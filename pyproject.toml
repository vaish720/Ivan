[project]
name = "sales-assistant"
version = "0.1.0"
description = "Voice assistant for sales reps on Outlook and Teams"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "msal>=1.31",
    "msal-extensions>=1.2",
    "pyyaml>=6.0",
    "tzlocal>=5.2",
    "tzdata>=2024.1",
]

[project.scripts]
app = "app.main:run"
eval = "app.evals.run:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
