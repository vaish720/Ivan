<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Assistant</title>
<style>
  :root {
    --bg: #f3f6f6; --surface: #fff; --ink: #142228; --muted: #5a6b70; --line: #d6dfe0;
    --accent: #0b6d66; --accent-ink: #fff; --accent-soft: #dcefec; --warn: #8a5200; --warn-soft: #fbefd9;
    --font: "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1719; --surface: #162226; --ink: #e4eeee; --muted: #98abaf; --line: #2a3a3e;
      --accent: #4fc3b6; --accent-ink: #0f1719; --accent-soft: #173a37; --warn: #f0b45a; --warn-soft: #3a2c14; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); display: grid; grid-template-rows: auto 1fr auto; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  header h1 { font-size: 1.05rem; margin: 0; flex: 1; }
  header a, header button { font: inherit; font-size: .9rem; color: var(--accent); background: none; border: 0; cursor: pointer; text-decoration: none; }
  .badge { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  #log { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; }
  .rep { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
  .bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); }
  .notice { align-self: center; font-size: .8rem; color: var(--warn); background: var(--warn-soft); padding: 3px 10px; border-radius: 999px; }
  .card { align-self: flex-start; width: min(100%, 440px); background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
  .card h2 { font-size: .95rem; margin: 0; color: var(--accent); }
  .card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; font-size: .9rem; }
  .card dt { color: var(--muted); }
  .card dd { margin: 0; }
  .card ul { margin: 0; padding: 6px 10px 6px 26px; background: var(--warn-soft); color: var(--warn); border-radius: 8px; font-size: .85rem; }
  .card .actions { display: flex; gap: 8px; }
  .card button { font: inherit; padding: 6px 14px; border-radius: 8px; cursor: pointer; border: 1px solid var(--accent); }
  .card .yes { background: var(--accent); color: var(--accent-ink); }
  .card .no { background: none; color: var(--accent); }
  .card.done { opacity: .6; border-color: var(--line); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface); max-width: 760px; width: 100%; margin: 0 auto; }
  input { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
  form button { font: inherit; padding: 0 18px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Sales Assistant</h1>
  <span class="badge" id="backend"></span>
  <a href="/activity">Activity Log</a>
  <button id="new">New chat</button>
</header>
<main id="log" aria-live="polite">
  <div class="msg bot">Hi! Try "what's on tomorrow?", "find 45 min with Priya next week" or "cancel my Acme pricing call".</div>
</main>
<form id="form">
  <input id="input" autocomplete="off" placeholder="Ask about your calendar…" aria-label="Message">
  <button id="send">Send</button>
</form>
<script>
const log = document.getElementById("log"), input = document.getElementById("input"), send = document.getElementById("send");
let openCard = null;

function add(cls, text) {
  const el = document.createElement("div");
  el.className = cls; el.textContent = text; log.appendChild(el); log.scrollTop = log.scrollHeight; return el;
}
function closeCard() { if (openCard) { openCard.classList.add("done"); openCard.querySelectorAll("button").forEach(b => b.remove()); openCard = null; } }
function card(p) {
  closeCard();
  const el = document.createElement("div"); el.className = "card";
  const h = document.createElement("h2"); h.textContent = p.headline; el.appendChild(h);
  const dl = document.createElement("dl");
  for (const [k, v] of Object.entries(p.details)) {
    const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.textContent = v; dl.append(dt, dd);
  }
  el.appendChild(dl);
  if (p.warnings.length) { const ul = document.createElement("ul"); p.warnings.forEach(w => { const li = document.createElement("li"); li.textContent = w; ul.appendChild(li); }); el.appendChild(ul); }
  const actions = document.createElement("div"); actions.className = "actions";
  const yes = document.createElement("button"); yes.className = "yes"; yes.textContent = "Confirm"; yes.onclick = () => post("/api/proposal/confirm");
  const no = document.createElement("button"); no.className = "no"; no.textContent = "Cancel"; no.onclick = () => post("/api/proposal/cancel");
  actions.append(yes, no); el.appendChild(actions);
  log.appendChild(el); log.scrollTop = log.scrollHeight; openCard = el;
}
function show(r) {
  if (r.notice) add("notice", r.notice);
  add("msg bot", r.text);
  if (r.proposal) card(r.proposal); else closeCard();
}
async function post(url, body) {
  send.disabled = true;
  const thinking = add("msg bot", "…");
  try {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    thinking.remove();
    if (!res.ok) { add("msg bot", "Something went wrong (" + res.status + "). Nothing was changed."); return; }
    show(await res.json());
  } catch (e) { thinking.remove(); add("msg bot", "Can't reach the assistant. Is it still running?"); }
  finally { send.disabled = false; input.focus(); }
}
document.getElementById("form").onsubmit = e => {
  e.preventDefault(); const text = input.value.trim(); if (!text) return;
  add("msg rep", text); input.value = ""; post("/api/chat", { message: text });
};
document.getElementById("new").onclick = async () => {
  await fetch("/api/new-chat", { method: "POST" }); openCard = null;
  log.replaceChildren(); add("msg bot", "New chat started.");
};
fetch("/api/status").then(r => r.json()).then(s => {
  document.getElementById("backend").textContent = s.calendar === "fake" ? "sample calendar" : "Outlook";
  if (s.notice) add("notice", s.notice);
});
input.focus();
</script>
</body>
</html>
